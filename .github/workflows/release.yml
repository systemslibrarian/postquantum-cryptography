name: Release

# Publishes the NuGet package + symbols + SBOM when a `v*` tag is pushed.
#
# Author signing is applied when a certificate secret is configured, and skipped
# (with a loud warning for stable tags) when it is not. A code-signing
# certificate is a recurring cost the project cannot fund right now — the same
# constraint documented for the external audit in KNOWN-GAPS.md. Restore the
# fail-closed behavior for stable tags once a certificate is configured.
# Packages always carry nuget.org's repository signature regardless.
#
# Required repository secrets:
#   NUGET_API_KEY        — push token for nuget.org (Account → API Keys)
#
# Optional (enables author signing):
#   CODESIGN_PFX_BASE64    — base64-encoded code-signing PFX
#   CODESIGN_PFX_PASSWORD  — PFX password

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0-preview.1)'
        required: true
        type: string

permissions:
  contents: write
  # SLSA-style build provenance attestation for the packed artifacts.
  id-token: write
  attestations: write

# All `run:` steps below use bash. ubuntu-latest defaults to bash; windows-latest
# defaults to PowerShell, so we pin the shell at the workflow level to keep every
# step's syntax (`set -euo pipefail`, `[[ … ]]`, here-docs, `base64 -d`, etc.)
# portable when the job runs on Windows. Git Bash is preinstalled on
# windows-latest, so `shell: bash` is supported there.
defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  CONFIGURATION: Release

jobs:
  publish:
    name: Pack, sign, and publish
    # Runs on windows-latest because the release smoke test invokes ML-KEM and
    # ML-DSA on the freshly-packed artifact. As of 2026-06, the GitHub-hosted
    # `ubuntu-latest` image's bundled .NET 10 runtime is NOT built against
    # OpenSSL 3.5+, so `MLKem.IsSupported` is false there and the smoke test
    # fails hard (see the 2026-06-02 v1.0.0-rc.1 release run, and
    # `KNOWN-GAPS.md` §"Platform / runtime availability"). The CI `build-test`
    # matrix's windows-latest lane runs all PQ-gated unit tests successfully
    # (proven on commit f882108: 121 PQ-gated tests Passed, 0 NotExecuted),
    # confirming this runner exposes the primitives.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine release flavour
        id: flavour
        # Stable = tag has no pre-release segment (no '-' after the version).
        # Examples: v1.0.0 → stable; v1.0.0-preview.1, v1.0.0-rc.2 → prerelease.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Release flavour: prerelease ($tag)"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Release flavour: stable ($tag)"
          fi

      - name: Restore
        run: dotnet restore PostQuantum.Cryptography.slnx

      - name: Build (CI deterministic)
        run: dotnet build PostQuantum.Cryptography.slnx -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        # LongRunning (1M-iteration chain, dudect timing) is covered by the
        # constant-time.yml lane; excluding it keeps the release path fast.
        run: dotnet test PostQuantum.Cryptography.slnx -c ${{ env.CONFIGURATION }} --no-build --filter "Category!=LongRunning"

      - name: Pack
        run: dotnet pack src/PostQuantum.Cryptography/PostQuantum.Cryptography.csproj -c ${{ env.CONFIGURATION }} --no-build -o ./artifacts/packages

      - name: Smoke-test the packaged artifact
        # Tag is `vX.Y.Z`; strip the leading 'v' to get the package version.
        run: |
          set -euo pipefail
          tag="${{ steps.flavour.outputs.tag }}"
          version="${tag#v}"
          bash ./tests/PostQuantum.Cryptography.SmokeTest/run-smoke-test.sh "$version" "${{ env.CONFIGURATION }}"

      - name: Generate SBOM (CycloneDX) — release asset
        run: |
          dotnet tool install --global CycloneDX || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p ./artifacts/sbom
          dotnet CycloneDX src/PostQuantum.Cryptography/PostQuantum.Cryptography.csproj -o ./artifacts/sbom
          # Rename the SBOM to include the tag so it's unambiguous on the release page.
          mv ./artifacts/sbom/bom.xml "./artifacts/sbom/PostQuantum.Cryptography.${{ steps.flavour.outputs.tag }}.cyclonedx.xml"

      - name: Sign packages (when a certificate is configured)
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CODESIGN_PFX_BASE64:-}" ]; then
            if [ "${{ steps.flavour.outputs.is_prerelease }}" = "true" ]; then
              echo "::warning::No CODESIGN_PFX_BASE64 secret configured — skipping package signing (prerelease)."
            else
              echo "::warning::STABLE RELEASE WITHOUT AUTHOR SIGNING — no CODESIGN_PFX_BASE64 secret configured. The package ships with only nuget.org's repository signature. This is a documented, funding-constrained gap (KNOWN-GAPS.md); configure CODESIGN_PFX_BASE64 / CODESIGN_PFX_PASSWORD to enable author signing and restore fail-closed."
            fi
            exit 0
          fi
          echo "$CODESIGN_PFX_BASE64" | base64 -d > codesign.pfx
          for pkg in ./artifacts/packages/*.nupkg; do
            dotnet nuget sign "$pkg" \
              --certificate-path codesign.pfx \
              --certificate-password "$CODESIGN_PFX_PASSWORD" \
              --timestamper http://timestamp.digicert.com
          done
          # Verify signatures landed.
          for pkg in ./artifacts/packages/*.nupkg; do
            dotnet nuget verify "$pkg"
          done
          rm -f codesign.pfx

      - name: Attest build provenance (SLSA)
        # Publishes a signed provenance statement binding the packed artifacts
        # to this workflow run, repo, and commit. Anyone can verify with:
        #   gh attestation verify <file> --repo systemslibrarian/postquantum-cryptography
        # Runs AFTER the (optional) author-signing step because signing rewrites
        # the .nupkg — the attested hashes must match the published bytes.
        # Complements (does not replace) author signing, which is currently
        # unfunded — see KNOWN-GAPS.md.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ./artifacts/packages/*.nupkg
            ./artifacts/packages/*.snupkg

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::NUGET_API_KEY secret is not set — cannot publish."
            exit 1
          fi
          for pkg in ./artifacts/packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            ./artifacts/packages/*
            ./artifacts/sbom/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.flavour.outputs.is_prerelease == 'true' }}
          files: |
            ./artifacts/packages/*.nupkg
            ./artifacts/packages/*.snupkg
            ./artifacts/sbom/*.cyclonedx.xml
