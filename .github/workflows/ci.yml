name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  CONFIGURATION: Release

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Report runtime PQC support
        # Visibility: shows whether this runner's runtime exposes ML-KEM/ML-DSA.
        # The test suite skips (does not fail) the PQC tests when unsupported.
        shell: bash
        run: |
          dotnet --info
          openssl version || true

      - name: Restore
        run: dotnet restore PostQuantum.Cryptography.slnx

      - name: Build (deterministic / CI)
        run: dotnet build PostQuantum.Cryptography.slnx -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        # Category=LongRunning (the 1M-iteration RFC 7748 chain, the dudect
        # timing test) is excluded from the per-push run; the dedicated
        # constant-time.yml lane and manual runs cover those.
        run: dotnet test PostQuantum.Cryptography.slnx -c ${{ env.CONFIGURATION }} --no-build --filter "Category!=LongRunning" --logger "trx;LogFileName=test-results-${{ matrix.os }}.trx" --results-directory ./artifacts/test-results --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: ./artifacts/test-results/**
          if-no-files-found: warn

  vulnerability-audit:
    name: Vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore (with NuGet audit)
        run: dotnet restore PostQuantum.Cryptography.slnx
      - name: List vulnerable packages
        # Fails the job if any *direct or transitive* dependency has a known
        # vulnerability. NuGetAudit is also active during restore (see
        # Directory.Build.props) but we make it explicit here so the failure
        # is visible in the job log.
        run: |
          set -euo pipefail
          out=$(dotnet list PostQuantum.Cryptography.slnx package --vulnerable --include-transitive 2>&1)
          echo "$out"
          if echo "$out" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable packages found."
            exit 1
          fi

  pack-and-sbom:
    name: Pack + SBOM
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PostQuantum.Cryptography.slnx

      - name: Build (CI)
        run: dotnet build PostQuantum.Cryptography.slnx -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: dotnet pack src/PostQuantum.Cryptography/PostQuantum.Cryptography.csproj -c ${{ env.CONFIGURATION }} --no-build -o ./artifacts/packages

      - name: Generate SBOM (CycloneDX)
        continue-on-error: true
        run: |
          dotnet tool install --global CycloneDX || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX src/PostQuantum.Cryptography/PostQuantum.Cryptography.csproj -o ./artifacts/sbom || true

      - name: Upload packages and SBOM
        uses: actions/upload-artifact@v7
        with:
          name: packages-and-sbom
          path: |
            ./artifacts/packages/*.nupkg
            ./artifacts/packages/*.snupkg
            ./artifacts/sbom/**
          if-no-files-found: warn

  determinism:
    name: Deterministic build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build twice and compare assembly hashes
        run: |
          set -euo pipefail
          dotnet build src/PostQuantum.Cryptography/PostQuantum.Cryptography.csproj -c ${{ env.CONFIGURATION }} -p:ContinuousIntegrationBuild=true -o ./out1
          dotnet build src/PostQuantum.Cryptography/PostQuantum.Cryptography.csproj -c ${{ env.CONFIGURATION }} -p:ContinuousIntegrationBuild=true -o ./out2
          h1=$(sha256sum ./out1/PostQuantum.Cryptography.dll | cut -d' ' -f1)
          h2=$(sha256sum ./out2/PostQuantum.Cryptography.dll | cut -d' ' -f1)
          echo "build 1: $h1"
          echo "build 2: $h2"
          if [ "$h1" != "$h2" ]; then
            echo "::error::Build is not deterministic — assembly hashes differ."
            exit 1
          fi
          echo "Deterministic build verified."
